<!DOCTYPE html>
<html>
<head>
  <title>Remove Color</title>
</head>
<body>

  <select id="colorSelect">
    <option>Red</option>
    <option>Green</option>
    <option>White</option>
    <option>Black</option>
  </select>

  <input type="button" value="Select and Remove" onclick="removeColor()">

  <script>
    function removeColor() {
      var select = document.getElementById("colorSelect");
      // Agar koi option selected hai tabhi remove karo
      if (select.selectedIndex !== -1) {
        select.remove(select.selectedIndex);
      }
    }
  </script>

</body>
</html>
